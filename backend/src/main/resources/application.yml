server:
  port: 8083

spring:
  application:
    name: parkings-messaging

  # --- Conexión a RabbitMQ (CloudAMQP u otro broker cloud) ---
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        # ACK manual (rúbrica): el consumidor confirma (ACK) o rechaza (NACK/DLQ)
        # explícitamente. Ver RabbitListenerConfig.
        acknowledge-mode: manual
        prefetch: 10

  # --- Conexión a Apache Kafka (clúster de brokers en Docker) ---
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all                       # espera confirmación de las réplicas (durabilidad)
      properties:
        enable.idempotence: true      # evita duplicados en reintentos del productor
    consumer:
      group-id: ${KAFKA_GROUP_ID:parkings-messaging}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer envuelve al JsonDeserializer: un payload corrupto
      # NO rompe el consumidor (va al manejador de errores / DLT). Rúbrica: manejo de errores.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "cl.duoc.parkings.messaging.kafka.event"
    admin:
      fail-fast: false                # el microservicio arranca aunque los brokers tarden en subir

# ─────────────────────────────────────────────────────────────────────────────
# Topología de mensajería CENTRALIZADA (rúbrica indicador 1).
# Ningún nombre de cola, exchange, binding o routing-key se escribe suelto en el
# código: todos se leen desde aquí a través de RabbitProperties.
# ─────────────────────────────────────────────────────────────────────────────
parkings:
  rabbit:
    exchange: parkings.exchange              # exchange de trabajo (topic, asíncrono dirigido)
    dead-letter-exchange: parkings.dlx       # exchange de mensajes muertos (DLX)
    fanout-exchange: parkings.broadcast      # exchange de difusión (Publish/Subscribe)

    # Mensajería SÍNCRONA (RPC request/reply): cotizar una reserva y esperar respuesta.
    rpc:
      exchange: parkings.rpc
      routing-key: rpc.cotizar
      queue: parkings.rpc.cotizar.q

    # Suscriptores del fanout (Publish/Subscribe): cada cola recibe una copia del evento.
    broadcast:
      email-queue: parkings.broadcast.email.q
      analytics-queue: parkings.broadcast.analytics.q

    # Políticas de retención aplicadas a las DLQ (x-message-ttl / x-max-length).
    retention:
      dlq-ttl-ms: 604800000                  # 7 días: un mensaje muerto se descarta pasado este tiempo
      dlq-max-length: 10000                  # tope de mensajes muertos retenidos por DLQ

    domains:
      notifications:
        queue: parkings.notifications.q
        dlq: parkings.notifications.dlq
        routing-key: notification.created
        dlq-routing-key: dlq.notification
      tickets:
        queue: parkings.tickets.q
        dlq: parkings.tickets.dlq
        routing-key: ticket.generate
        dlq-routing-key: dlq.ticket
      documents:
        queue: parkings.documents.q
        dlq: parkings.documents.dlq
        routing-key: document.generate
        dlq-routing-key: dlq.document

  # ───────────────────────────────────────────────────────────────────────────
  # Streaming con Apache Kafka (EP5): nombres de tópicos, particiones, réplicas,
  # retención y consumer groups centralizados (se leen desde KafkaProperties).
  #   - 2 tópicos: ocupación (telemetría de plazas) y pagos (transacciones).
  #   - 3 particiones y 3 réplicas por tópico (requiere 3 brokers).
  # ───────────────────────────────────────────────────────────────────────────
  kafka:
    partitions: ${KAFKA_PARTITIONS:3}
    replicas: ${KAFKA_REPLICAS:3}
    retention-ms: 604800000          # 7 días de retención de eventos
    cleanup-policy: delete           # política de limpieza por tiempo/tamaño
    topics:
      ocupacion: parkings.ocupacion  # telemetría de ocupación de estacionamientos
      pagos: parkings.pagos          # eventos de pago / transacciones
    groups:
      ocupacion: parkings-ocupacion-group
      pagos: parkings-pagos-group
    # Generador de flujo CONTINUO para la demostración (streaming en vivo).
    stream-generator:
      enabled: ${KAFKA_STREAM_ENABLED:false}
      interval-ms: ${KAFKA_STREAM_INTERVAL_MS:3000}

logging:
  level:
    cl.duoc.parkings.messaging: INFO

---
# Config del IDaaS SOLO fuera del perfil "local" (en local se demuestra sin IDaaS).
spring:
  config:
    activate:
      on-profile: "!local"
  security:
    oauth2:
      resourceserver:
        jwt:
          # Apunta al IDaaS (Keycloak / Auth0 / Azure AD / Cognito...).
          issuer-uri: ${IDAAS_ISSUER_URI:https://idaas.example.com/realms/parkings}
          jwk-set-uri: ${IDAAS_JWK_SET_URI:https://idaas.example.com/realms/parkings/protocol/openid-connect/certs}
