# ═══════════════════════════════════════════════════════════════════════
# Parkings Together — Stack completo para la nube (DSY1107 · EP4)
#
# Levanta TODO con un solo comando:  docker compose up -d
#   - rabbitmq1 + rabbitmq2  → clúster de 2 nodos (mensajería)
#   - keycloak               → IDaaS (tenant + usuarios + OAuth2/OIDC)
#   - backend                → microservicio Spring Boot (RabbitMQ)
#   - frontend               → SPA que hace login OIDC y llama al backend
#
# PUBLIC_HOST: en local = localhost; en Azure = la IP pública (o DNS) de la VM.
# Debe ser el MISMO host que usan el navegador y el backend, para que el
# "issuer" del JWT coincida (si no, la validación del token falla).
# ═══════════════════════════════════════════════════════════════════════
name: parkings-ep4

services:
  # ── Nodo 1 del clúster RabbitMQ ──────────────────────────────────────
  rabbitmq1:
    image: rabbitmq:3.13-management
    hostname: rabbitmq1
    container_name: rabbitmq1
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-parkings-cookie}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Panel de administración (nodo 1)

  # ── Nodo 2 del clúster RabbitMQ ──────────────────────────────────────
  rabbitmq2:
    image: rabbitmq:3.13-management
    hostname: rabbitmq2
    container_name: rabbitmq2
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-parkings-cookie}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "15673:15672"    # Panel de administración (nodo 2)
    depends_on:
      - rabbitmq1

  # ── IDaaS: Keycloak (tenant + usuarios + OAuth2/OIDC) ────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KC_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./keycloak/realm-parkings.json:/opt/keycloak/data/import/realm-parkings.json:ro
    ports:
      - "8080:8080"

  # ── Backend: microservicio de mensajería (RabbitMQ) ──────────────────
  backend:
    build: ./backend
    container_name: parkings-backend
    environment:
      # Se conecta al clúster (si un nodo cae, usa el otro).
      SPRING_RABBITMQ_ADDRESSES: "rabbitmq1:5672,rabbitmq2:5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      # El "issuer" (emisor) debe coincidir con el host público con que el
      # navegador obtuvo el token; las llaves (JWKS) se buscan por la red
      # interna de Docker (siempre alcanzable), evitando problemas de red.
      IDAAS_ISSUER_URI: "http://${PUBLIC_HOST:-localhost}:8080/realms/parkings"
      IDAAS_JWK_SET_URI: "http://keycloak:8080/realms/parkings/protocol/openid-connect/certs"
      # CORS: permite que el frontend (en :8081) llame al backend directo en local.
      # En Azure el CORS lo pone el API Manager; esto cubre el consumo directo.
      PARKINGS_CORS_ALLOWED_ORIGINS: "http://localhost:8081,http://${PUBLIC_HOST:-localhost}:8081"
    ports:
      - "8083:8083"
    depends_on:
      - rabbitmq1
      - rabbitmq2
      - keycloak

  # ── Frontend: SPA (login OIDC + consumo del backend vía API Manager) ─
  frontend:
    build: ./frontend
    container_name: parkings-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
