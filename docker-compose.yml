# ═══════════════════════════════════════════════════════════════════════
# Parkings Together — Stack cloud-native completo (DSY1107 · EP4/EP5/EP6)
#
# Levanta TODO con un solo comando:  docker compose up -d --build
#   - rabbitmq1 + rabbitmq2            → clúster RabbitMQ (mensajería MQ)
#   - zookeeper1/2/3 + kafka1/2/3      → clúster Apache Kafka (streaming)
#   - kafka-ui                         → administración de brokers y tópicos
#   - keycloak                         → IDaaS (tenant + usuarios + OAuth2/OIDC)
#   - backend                          → microservicio Spring Boot (RabbitMQ + Kafka)
#   - frontend                         → SPA (login OIDC + consumo + métricas)
#
# PUBLIC_HOST: en local = localhost; en la nube = la IP/DNS pública.
# ═══════════════════════════════════════════════════════════════════════
name: parkings-ep4

services:
  # ── RabbitMQ (clúster de 2 nodos) ────────────────────────────────────
  rabbitmq1:
    image: rabbitmq:3.13-management
    hostname: rabbitmq1
    container_name: rabbitmq1
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-parkings-cookie}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "5672:5672"
      - "15672:15672"

  rabbitmq2:
    image: rabbitmq:3.13-management
    hostname: rabbitmq2
    container_name: rabbitmq2
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-parkings-cookie}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "15673:15672"
    depends_on:
      - rabbitmq1

  # ── Apache Kafka: ensemble Zookeeper (3 nodos) ───────────────────────
  zookeeper1:
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper1
    container_name: zookeeper1
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVERS: "zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888"

  zookeeper2:
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper2
    container_name: zookeeper2
    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVERS: "zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888"

  zookeeper3:
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper3
    container_name: zookeeper3
    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVERS: "zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888"

  # ── Apache Kafka: 3 brokers (permiten réplicas = 3) ──────────────────
  kafka1:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka1
    container_name: kafka1
    depends_on: [zookeeper1, zookeeper2, zookeeper3]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper1:2181,zookeeper2:2181,zookeeper3:2181"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka1:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"

  kafka2:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka2
    container_name: kafka2
    depends_on: [zookeeper1, zookeeper2, zookeeper3]
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper1:2181,zookeeper2:2181,zookeeper3:2181"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka2:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"

  kafka3:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka3
    container_name: kafka3
    depends_on: [zookeeper1, zookeeper2, zookeeper3]
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper1:2181,zookeeper2:2181,zookeeper3:2181"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka3:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"

  # ── Kafka UI: administración de brokers, tópicos, particiones, mensajes
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    depends_on: [kafka1, kafka2, kafka3]
    environment:
      KAFKA_CLUSTERS_0_NAME: parkings
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8082:8080"

  # ── IDaaS: Keycloak ──────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KC_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./keycloak/realm-parkings.json:/opt/keycloak/data/import/realm-parkings.json:ro
    ports:
      - "8080:8080"

  # ── Backend: microservicio (RabbitMQ + Kafka) ────────────────────────
  backend:
    build: ./backend
    container_name: parkings-backend
    environment:
      SPRING_RABBITMQ_ADDRESSES: "rabbitmq1:5672,rabbitmq2:5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      # Kafka: se conecta a los 3 brokers y genera un flujo continuo para la demo.
      KAFKA_BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      KAFKA_STREAM_ENABLED: "true"
      IDAAS_ISSUER_URI: "http://${PUBLIC_HOST:-localhost}:8080/realms/parkings"
      IDAAS_JWK_SET_URI: "http://keycloak:8080/realms/parkings/protocol/openid-connect/certs"
      PARKINGS_CORS_ALLOWED_ORIGINS: "http://localhost:8081,http://${PUBLIC_HOST:-localhost}:8081"
    ports:
      - "8083:8083"
    depends_on:
      - rabbitmq1
      - rabbitmq2
      - kafka1
      - kafka2
      - kafka3
      - keycloak

  # ── Frontend: SPA ────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: parkings-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
