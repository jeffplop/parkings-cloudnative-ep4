# ─────────────────────────────────────────────────────────────
# Configuración de CLÚSTER de RabbitMQ (2 nodos) — peer discovery
# por configuración "clásica": ambos nodos se descubren y forman
# el clúster solos al arrancar, siempre que compartan el erlang cookie.
# ─────────────────────────────────────────────────────────────
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq2

# Si hay una partición de red, el clúster se auto-repara.
cluster_partition_handling = autoheal

# Permite que el usuario guest se conecte desde otros hosts (solo para demo).
loopback_users.guest = false
